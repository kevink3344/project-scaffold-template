# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - scaffoldtemp

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-webapp-scaffoldtemp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        env:
          VITE_DB_SERVER: ${{ secrets.VITE_DB_SERVER }}
          VITE_DB_NAME: ${{ secrets.VITE_DB_NAME }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: artifact

      - name: Prepare deploy package
        run: |
          rm -rf deploy
          mkdir -p deploy

          if [ -f artifact/index.html ]; then
            cp -R artifact/. deploy/
          elif [ -f artifact/dist/index.html ]; then
            cp -R artifact/dist/. deploy/
          else
            echo "Could not find index.html in expected artifact locations"
            find artifact -maxdepth 4 -type f
            exit 1
          fi

          cd deploy
          zip -r ../release.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8404B4D50A0C45A8B194AA408F3CA416 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_38806FF5FE394A4A94B4057724442294 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5EFBABCD13F7498E94BECF3C55F8A036 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'scaffoldtemp'
          slot-name: 'Production'
          package: release.zip
          clean: true
          startup-command: 'pm2 serve /home/site/wwwroot --no-daemon --spa'
          