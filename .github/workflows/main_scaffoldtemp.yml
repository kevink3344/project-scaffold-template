# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - scaffoldtemp

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-webapp-scaffoldtemp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        env:
          VITE_DB_SERVER: ${{ secrets.VITE_DB_SERVER }}
          VITE_DB_NAME: ${{ secrets.VITE_DB_NAME }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_APP_VERSION: ${{ github.sha }}
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Validate built SPA artifact
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Missing dist/index.html after build"
            exit 1
          fi

          if grep -q '/src/main.tsx' dist/index.html; then
            echo "dist/index.html still references /src/main.tsx; refusing to deploy source build"
            exit 1
          fi

          echo "Built index signature:"
          sed -n '1,40p' dist/index.html

      - name: Create release package from dist
        run: |
          rm -f release.zip
          rm -rf release
          mkdir -p release
          cp -R dist release/dist
          cp server.js release/server.js
          cd release
          zip -r ../release.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8404B4D50A0C45A8B194AA408F3CA416 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_38806FF5FE394A4A94B4057724442294 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5EFBABCD13F7498E94BECF3C55F8A036 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'scaffoldtemp'
          slot-name: 'Production'
          package: release.zip
          clean: true
          startup-command: 'node /home/site/wwwroot/server.js'

      - name: Restart App Service
        shell: bash
        run: |
          RG=$(az resource list --name scaffoldtemp --resource-type "Microsoft.Web/sites" --query "[0].resourceGroup" -o tsv)
          if [ -z "$RG" ]; then
            echo "Could not determine resource group for scaffoldtemp"
            exit 1
          fi

          az webapp restart --name scaffoldtemp --resource-group "$RG"
          